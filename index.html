<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El-Forsan — نظام إدارة الجيم</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            fadeSlideUp: { '0%': { opacity: 0, transform: 'translateY(14px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
            pulseSlow: { '0%,100%': { opacity: .18 }, '50%': { opacity: .32 } },
            popIn: { '0%': { transform: 'scale(.5)', opacity: 0 }, '60%': { transform: 'scale(1.08)', opacity: 1 }, '100%': { transform: 'scale(1)' } },
            barFlash: { '0%': { backgroundColor: 'rgba(28,140,78,.18)' }, '100%': { backgroundColor: 'transparent' } },
          },
          animation: {
            'fade-slide-up': 'fadeSlideUp .45s ease-out',
            'pulse-slow': 'pulseSlow 4s ease-in-out infinite',
            'pop-in': 'popIn .45s cubic-bezier(.34,1.56,.64,1)',
            'bar-flash': 'barFlash 1s ease-out',
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --ink: #16181C;
      --paper: #F5F5F1;
      --surface: #FFFFFF;
      --line: #E3E1DA;
      --muted: #7A7D82;
      --accent: #fff81f;
      --accent-dim: #FFF9C2;
      --good: #1C8C4E;
      --good-dim: #DCF3E4;
      --warn: #B9790A;
      --warn-dim: #FBECD0;
      --danger: #C93B3B;
      --danger-dim: #FBE1E1;
      --radius: 7px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    [dir="ltr"] body,
    .ltr {
      direction: ltr;
    }

    button {
      font-family: inherit;
    }

    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* ---------- App shell ---------- */
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.02em;
      color: #fff;
      white-space: nowrap;
    }

    .brand .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 9px;
    }

    /* ---------- Top navigation bar with dropdown menus ---------- */
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--ink);
      color: #EDEDEA;
      padding: 10px 20px;
      position: relative;
      z-index: 40;
    }

    .topnav-left {
      display: flex;
      align-items: center;
      gap: 22px;
      min-width: 0;
    }

    .topnav-groups {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .nav-group {
      position: relative;
    }

    .nav-group-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #C7C9CC;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .nav-group-btn .caret {
      font-size: 9px;
      opacity: .75;
      transition: transform .15s;
    }

    .nav-group-btn:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff;
    }

    .nav-group-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .nav-group.open .nav-group-btn {
      background: rgba(255, 255, 255, .1);
      color: #fff;
    }

    .nav-group.open .nav-group-btn .caret {
      transform: rotate(180deg);
    }

    .nav-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      inset-inline-start: 0;
      min-width: 200px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .16);
      display: none;
      flex-direction: column;
      gap: 1px;
    }

    .nav-group.open .nav-dropdown {
      display: flex;
    }

    .nav-dropdown button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: start;
      padding: 9px 10px;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-dropdown button:hover {
      background: var(--paper);
    }

    .nav-dropdown button.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .nav-dropdown button .ic {
      width: 16px;
      text-align: center;
      opacity: .85;
    }

    .topnav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .langtoggle {
      display: flex;
      gap: 4px;
    }

    .langtoggle button {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: transparent;
      color: #C7C9CC;
      cursor: pointer;
      font-weight: 700;
      font-size: 11.5px;
    }

    .langtoggle button.on {
      background: #fff;
      color: var(--ink);
      border-color: #fff;
    }

    .userchip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, .06);
      border-radius: 8px;
    }

    .userchip .av {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      flex: 0 0 24px;
    }

    .userchip .meta {
      min-width: 0;
      display: none;
    }

    .userchip .name {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .userchip .role {
      font-size: 10px;
      color: #9A9DA2;
    }

    .logoutbtn {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: transparent;
      color: #C7C9CC;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .logoutbtn:hover {
      background: rgba(255, 255, 255, .08);
      color: #fff;
    }

    /* ---------- Mobile hamburger + slide panel ---------- */
    .hamburger-btn {
      display: none;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, .18);
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    .mobile-nav-panel {
      display: none;
      flex-direction: column;
      gap: 2px;
      background: var(--ink);
      padding: 8px 14px 14px 14px;
    }

    .mobile-nav-panel.open {
      display: flex;
    }

    .mobile-nav-panel .mnav-section-label {
      color: #8C8F94;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: 10px 8px 4px 8px;
    }

    .mobile-nav-panel button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: start;
      padding: 10px 10px;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: #C7C9CC;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .mobile-nav-panel button:hover {
      background: rgba(255, 255, 255, .06);
      color: #fff;
    }

    .mobile-nav-panel button.active {
      background: var(--accent);
      color: #fff;
    }

    .mobile-nav-panel button .ic {
      width: 18px;
      text-align: center;
      opacity: .9;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 26px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .topbar h1 {
      font-size: 21px;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .topbar .sub {
      color: var(--muted);
      font-size: 12.5px;
      margin-top: 2px;
    }

    .content {
      padding: 24px 26px 60px 26px;
      flex: 1;
    }

    /* ---------- Reusable bits ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 6px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
    }

    .btn.danger {
      background: var(--danger);
      border-color: var(--danger);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.small {
      padding: 5px 10px;
      font-size: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .between {
      justify-content: space-between;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 19px;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .tile {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
    }

    .tile .label {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .tile .value {
      font-size: 30px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .tile .value.good {
      color: var(--good);
    }

    .tile .value.warn {
      color: var(--warn);
    }

    .tile .value.danger {
      color: var(--danger);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    thead th {
      text-align: start;
      font-size: 11.5px;
      text-transform: none;
      color: var(--muted);
      font-weight: 700;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #FAFAF8;
    }

    tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #FBFBF9;
    }

    .table-wrap {
      margin-bottom: 22px;
    }

    .badge {
      display: inline-flex;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .badge.good {
      background: var(--good-dim);
      color: var(--good);
    }

    .badge.warn {
      background: var(--warn-dim);
      color: var(--warn);
    }

    .badge.danger {
      background: var(--danger-dim);
      color: var(--danger);
    }

    .badge.muted {
      background: #EEEEEA;
      color: var(--muted);
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .empty b {
      display: block;
      color: var(--ink);
      font-size: 15px;
      margin-bottom: 4px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .toolbar input[type=text],
    .toolbar input[type=search],
    .toolbar select {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
    }

    /* ---------- Modal ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 18, .45);
      display: none;
      align-items: flex-start;
      justify-content: center;
      z-index: 50;
      padding: 40px 16px;
      overflow: auto;
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 560px;
      padding: 22px;
      border: 1px solid var(--line);
    }

    .modal.wide {
      max-width: 760px;
    }

    .modal h3 {
      margin: 0 0 16px 0;
      font-size: 17px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13.5px;
      background: #fff;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .kpi-row {
      display: flex;
      gap: 8px;
    }

    .pill {
      padding: 4px 10px;
      border-radius: 20px;
      background: #EEEEEA;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 18px;
      align-items: start;
    }

    .cart-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .qtybtn {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .prod-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      cursor: pointer;
      background: #fff;
    }

    .prod-card:hover {
      border-color: var(--accent);
    }

    .prod-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      inset-inline-end: 22px;
      background: var(--ink);
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .2);
      display: none;
    }

    .toast.show {
      display: block;
    }

    /* ---------- Barcode scan bar ---------- */
    .scanbar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--ink);
      color: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .scanbar input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      background: rgba(255, 255, 255, .1);
      color: #fff;
      outline: none;
    }

    .scanbar input::placeholder {
      color: rgba(255, 255, 255, .5);
    }

    .scanbar input:focus {
      background: rgba(255, 255, 255, .16);
    }

    /* ---------- Calendar ---------- */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .cal-day {
      aspect-ratio: 1;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-weight: 700;
      position: relative;
    }

    .cal-day.present {
      background: var(--good-dim);
      color: var(--good);
    }

    .cal-day.absent {
      background: var(--danger-dim);
      color: var(--danger);
    }

    .cal-day.na {
      background: #F0F0EC;
      color: #C9C9C2;
    }

    .cal-day.today {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }

    .cal-day.has-workout::after {
      content: "";
      position: absolute;
      bottom: 4px;
      inset-inline-start: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      opacity: .55;
    }

    .cal-day.selected {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .cal-head {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      font-weight: 700;
      padding-bottom: 4px;
    }

    /* ---------- Scan feedback overlay ---------- */
    #scanOverlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 16, 14, .55);
      backdrop-filter: blur(2px);
    }

    #scanOverlay.show {
      display: flex;
    }

    .scan-card {
      background: #fff;
      border-radius: 18px;
      padding: 34px 46px;
      text-align: center;
      min-width: 260px;
    }

    .scan-icon {
      font-size: 52px;
      line-height: 1;
      margin-bottom: 10px;
    }

    @media (max-width: 880px) {
      .topnav-groups {
        display: none;
      }

      .hamburger-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .tiles {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .prod-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .topbar {
        padding: 14px 16px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .content {
        padding: 16px 16px 60px 16px;
      }
    }

    @media (max-width: 560px) {

      .userchip .name,
      .userchip .role {
        display: none;
      }

      .userchip {
        padding: 6px;
      }

      .langtoggle {
        display: none;
      }

      .tiles {
        grid-template-columns: 1fr 1fr;
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar input,
      .toolbar select {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <div id="scanOverlay">
    <div class="scan-card animate-pop-in" id="scanCard"></div>
  </div>

  <script>
    /* =========================================================================
       i18n

    const T = {

        member_new: "عضو جديد", member_edit: "تعديل بيانات العضو", plan: "الباقة", join_date: "تاريخ الانضمام",
        expiry: "تاريخ الانتهاء", price: "السعر", duration: "المدة (أيام)", no_members: "لا يوجد أعضاء بعد",
        no_members_sub: "ابدأ بإضافة أول عضو في الجيم", assign_plan: "تفعيل / تجديد اشتراك", record_payment: "تسجيل دفعة",

    function addDays(dateStr, days) { const d = new Date(dateStr); d.setDate(d.getDate() + Number(days)); return d.toISOString().slice(0, 10); }

      state.members.forEach(m => {

      });
      return "M-" + String(max + 1).padStart(4, "0");
    }

    async function loadState() {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) { state = JSON.parse(res.value); if (!state.users) state.users = []; if (!state.workout_plans) state.workout_plans = []; if (!state.meal_plans) state.meal_plans = []; if (!state.orders) state.orders = []; return; }
      } catch (e) { /* not found */ }
      state = seedDemoData();
      await persist();
    }

    function persist() {
      clearTimeout(saveTimer);
      return new Promise((resolve) => {
        saveTimer = setTimeout(async () => {
          try { await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
          catch (e) { console.error("save failed", e); }
          resolve();
        }, 150);
      });
    }

      try {
        const res = await window.storage.get(SESSION_KEY, false);
        if (res && res.value) { session = JSON.parse(res.value); }
      } catch (e) { session = null; }
    }
    async function saveSession() {
      try { await window.storage.set(SESSION_KEY, JSON.stringify(session), false); } catch (e) { }
    }
    async function clearSession() {
      try { await window.storage.delete(SESSION_KEY, false); } catch (e) { }
      session = null;
    }

    function getMember(id) { return state.members.find(m => m.id === id); }
    function getMemberByCode(code) { return state.members.find(m => (m.code || "").toLowerCase() === (code || "").toLowerCase()); }
    function getPlan(id) { return state.plans.find(p => p.id === id); }
    function getTrainer(id) { return state.trainers.find(t => t.id === id); }
    function getProduct(id) { return state.products.find(p => p.id === id); }
    function planName(p) { return p ? (currentLang === "ar" ? p.name_ar : p.name_en) : t("none"); }
    function productName(p) { return p ? (currentLang === "ar" ? p.name_ar : p.name_en) : t("none"); }
    function className(c) { return c ? (currentLang === "ar" ? c.name_ar : c.name_en) : t("none"); }
    function specName(tr) { return tr ? (currentLang === "ar" ? tr.specialization_ar : tr.specialization_en) : ""; }

    function activeSubscription(memberId) {
      const subs = state.subscriptions.filter(s => s.member_id === memberId);
      if (!subs.length) return null;
      subs.sort((a, b) => new Date(b.end_date) - new Date(a.end_date));
      return subs[0];
    }
    function subStatus(sub) {
      if (!sub) return "expired";
      if (sub.status === "frozen") return "frozen";
      const daysLeft = daysBetween(todayISO(), sub.end_date);
      if (daysLeft < 0) return "expired";
      return "active";
    }
    function memberStatusBadge(memberId) {
      const sub = activeSubscription(memberId);
      const st = subStatus(sub);
      const daysLeft = sub ? daysBetween(todayISO(), sub.end_date) : null;
      if (st === "active" && daysLeft !== null && daysLeft <= 5) return { cls: "warn", label: t("active") + " (" + daysLeft + "d)" };
      if (st === "active") return { cls: "good", label: t("active") };
      if (st === "frozen") return { cls: "muted", label: t("frozen") };
      return { cls: "danger", label: t("expired") };
    }
    function subscriptionActiveOn(memberId, dateStr) {
      return state.subscriptions.some(s => s.member_id === memberId && dateStr >= s.start_date && dateStr <= s.end_date);
    }

    function todayRevenue() {
      const today = todayISO();
      let total = 0;
      state.payments.forEach(p => { if (p.date === today) total += Number(p.amount); });
      state.sales.forEach(s => { if ((s.date || "").slice(0, 10) === today) total += Number(s.net_amount); });
      return total;
    }
    function monthRevenue() {
      const ym = todayISO().slice(0, 7);
      let total = 0;
      state.payments.forEach(p => { if ((p.date || "").slice(0, 7) === ym) total += Number(p.amount); });
      state.sales.forEach(s => { if ((s.date || "").slice(0, 7) === ym) total += Number(s.net_amount); });
      return total;
    }
    function monthExpenses() {
      const ym = todayISO().slice(0, 7);
      return state.expenses.filter(e => (e.date || "").slice(0, 7) === ym).reduce((a, e) => a + Number(e.amount), 0);
    }
    function todayCheckins() {
      const today = todayISO();
      return state.attendance.filter(a => (a.time || "").slice(0, 10) === today).length;
    }
    function expiringSoonCount() {
      return state.members.filter(m => {
        const sub = activeSubscription(m.id);
        if (!sub) return false;
        const d = daysBetween(todayISO(), sub.end_date);
        return d >= 0 && d <= 5;
      }).length;
    }

    /* --- plans --- */
    const WEEK_DAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
    function getWorkoutPlan(memberId) {
      let p = state.workout_plans.find(x => x.member_id === memberId);
      if (!p) {
        p = { id: uid("wp"), member_id: memberId, days: {} };
        WEEK_DAYS.forEach(d => p.days[d] = []);
      }
      WEEK_DAYS.forEach(d => { if (!p.days[d]) p.days[d] = []; });
      return p;
    }
    function getMealPlan(memberId) {
      let p = state.meal_plans.find(x => x.member_id === memberId);
      if (!p) {
        p = { id: uid("mp"), member_id: memberId, days: {} };
        WEEK_DAYS.forEach(d => p.days[d] = []);
      }
      WEEK_DAYS.forEach(d => { if (!p.days[d]) p.days[d] = []; });
      return p;
    }
    function planHasContent(plan) {
      return WEEK_DAYS.some(d => (plan.days[d] || []).length > 0);
    }

    async function attemptLogin() {
      const phone = document.getElementById("loginPhone").value.trim();
      const password = document.getElementById("loginPassword").value;
      const user = state.users.find(u => u.phone === phone && u.password === password);
      const errEl = document.getElementById("loginError");
      if (!user) {
        errEl.textContent = t("invalid_login");
        errEl.classList.remove("hidden");
        return;
      }
      if (user.role === "employee") {
        session = { role: "staff", userId: user.id, name: user.name, is_admin: !!user.is_admin, perms: user.perms || { pos: false, renew: false, inventory: false } };
      } else {
        session = { role: "member", userId: user.id, memberId: user.member_id, name: user.name };
      }
      await saveSession();
      routeToApp();
    }

        <div class="table-wrap">
          ${list.length ? `<table><thead><tr><th>${t("my_code")}</th><th>${t("name")}</th><th>${t("status")}</th><th>${t("actions")}</th></tr></thead>

        const b = memberStatusBadge(m.id);
        const sub = activeSubscription(m.id);

        return `<tr>

      }).join("")}</tbody></table>` : `<div class="empty"><b>${t("no_members")}</b></div>`}

        <div class="table-wrap">
          <table><thead><tr><th>${t("name")}</th><th>${t("today")}</th></tr></thead>
          <tbody id="recentAttBody">${recent.length ? recent.map(a => {
        const m = getMember(a.member_id);
        const dt = new Date(a.time);
        const label = dt.toLocaleDateString(currentLang === "ar" ? "ar-EG" : "en-US") + " " + dt.toLocaleTimeString(currentLang === "ar" ? "ar-EG" : "en-US", { hour: '2-digit', minute: '2-digit' });
        return `<tr><td>${m ? m.name : "—"}</td><td>${label}</td></tr>`;

      </div>

      barcodeInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const code = barcodeInput.value.trim();
          barcodeInput.value = "";
          if (!code) return;
          handleBarcodeScan(code);
        }
      });
      barcodeInput.focus();
    }
    function handleBarcodeScan(code) {
      const m = getMemberByCode(code);
      if (!m) { showScanFeedback(false, t("scan_fail"), code); return; }
      const sub = activeSubscription(m.id);
      if (subStatus(sub) !== "active") {
        showScanFeedback(false, t("checkin_blocked"), m.name);
        return;

      state.attendance.push({ id: uid("att"), member_id: m.id, time: nowISO() });
      persist();

      if (currentTab === "attendance") renderAttendance(document.getElementById("content"));

    /* =========================================================================
       POS (+ pending store-orders fulfillment)
    ========================================================================= */
    let cart = [];
    function renderPOS(c) {
      const products = state.products;
      const pending = state.orders.filter(o => o.status === "pending");
      c.innerHTML = `
    ${pending.length ? `
    <div class="section-head"><h2>${t("pending_orders")}</h2></div>

        return `<tr>

      }).join("")}</tbody></table>
    </div>` : ""}
    <div class="grid-2">
      <div>
        <div class="prod-grid" id="prodGrid">
          ${products.map(p => `
            <div class="prod-card" onclick="addToCart('${p.id}')">

                <span class="pill">${t("stock")}: ${p.stock}</span>

              </div>
            </div>`).join("")}
        </div>
      </div>
      <div>
        <div class="section-head"><h2>${t("cart")}</h2></div>
        <div id="cartBox" class="table-wrap" style="padding:14px;">
          ${renderCartHTML()}
        </div>
      </div>
    </div>
  `;
    }
    function renderCartHTML() {
      if (!cart.length) return `<div class="empty">${t("empty_cart")}</div>`;
      const total = cart.reduce((a, l) => a + l.qty * l.price, 0);
      const members = state.members;
      return `
    ${cart.map((l, i) => `
      <div class="cart-line">
        <div>${productName(getProduct(l.productId))}<div class="sub" style="color:var(--muted);font-size:12px;">${fmtMoney(l.price)} × ${l.qty}</div></div>
        <div class="row">
          <button class="qtybtn" onclick="changeQty(${i},-1)">−</button>
          <span>${l.qty}</span>
          <button class="qtybtn" onclick="changeQty(${i},1)">+</button>
        </div>
      </div>`).join("")}
    <div class="field" style="margin-top:12px;"><label>${t("link_member")}</label>
      <select id="cartMember"><option value="">${t("walkin")}</option>${members.map(m => `<option value="${m.id}">${m.name}</option>`).join("")}</select>
    </div>
    <div class="field"><label>${t("method")}</label>
      <select id="cartMethod"><option value="cash">${t("pay_cash")}</option><option value="card">${t("pay_card")}</option><option value="wallet">${t("pay_wallet")}</option></select>
    </div>
    <div class="row between" style="margin-top:10px;font-size:16px;font-weight:800;">
      <span>${t("total")}</span><span>${fmtMoney(total)}</span>
    </div>
    <button class="btn primary" style="width:100%;margin-top:12px;justify-content:center;" onclick="checkout()">${t("checkout")}</button>
  `;
    }
    function addToCart(productId) {
      const p = getProduct(productId);
      if (p.stock <= 0) return;
      const existing = cart.find(l => l.productId === productId);
      if (existing) { if (existing.qty < p.stock) existing.qty++; }
      else cart.push({ productId, qty: 1, price: p.price });
      document.getElementById("cartBox").innerHTML = renderCartHTML();
    }
    function changeQty(i, delta) {
      const line = cart[i];
      const p = getProduct(line.productId);
      line.qty += delta;
      if (line.qty <= 0) cart.splice(i, 1);
      else if (line.qty > p.stock) line.qty = p.stock;
      document.getElementById("cartBox").innerHTML = renderCartHTML();
    }
    function checkout() {
      if (!cart.length) return;
      const memberId = document.getElementById("cartMember").value || null;
      const method = document.getElementById("cartMethod").value;
      const total = cart.reduce((a, l) => a + l.qty * l.price, 0);
      const saleId = uid("sale");
      state.sales.push({
        id: saleId, member_id: memberId, cashier: "Reception", date: nowISO(), total_amount: total, discount_amount: 0, net_amount: total, payment_method: method,
        items: cart.map(l => ({ product_id: l.productId, qty: l.qty, unit_price: l.price, subtotal: l.qty * l.price }))
      });
      cart.forEach(l => { const p = getProduct(l.productId); p.stock -= l.qty; });
      if (memberId) {
        state.payments.push({ id: uid("pay"), member_id: memberId, subscription_id: null, sale_id: saleId, amount: total, method, date: todayISO(), invoice: "POS-" + Math.floor(1000 + Math.random() * 9000) });
      }
      cart = [];
      persist(); showToast(t("sale_done")); renderPOS(document.getElementById("content"));
    }
    function fulfillOrder(orderId) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order || order.status !== "pending") return;
      order.items.forEach(it => { const p = getProduct(it.product_id); if (p) p.stock -= it.qty; });
      order.status = "fulfilled";
      order.fulfilled_date = todayISO();
      if (order.member_id) {
        state.payments.push({ id: uid("pay"), member_id: order.member_id, subscription_id: null, sale_id: null, amount: order.total, method: "cash", date: todayISO(), invoice: "ORD-" + order.id.slice(-6) });
      }
      persist(); showToast(t("saved")); renderPOS(document.getElementById("content"));
    }
    window.addToCart = addToCart;
    window.changeQty = changeQty;
    window.checkout = checkout;
    window.fulfillOrder = fulfillOrder;

    /* =========================================================================
       ATTENDANCE CALENDAR (shared by staff modal + member portal)
       — merged with the workout plan: clicking a day shows that weekday's exercises
    ========================================================================= */
    function buildCalendarHTML(memberId, year, month, clickable) {
      const attSet = new Set(state.attendance.filter(a => a.member_id === memberId).map(a => (a.time || "").slice(0, 10)));
      const workout = getWorkoutPlan(memberId);
      const first = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startWeekday = first.getDay();
      const today = todayISO();
      const dayKeys = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
      let cells = "";
      for (let i = 0; i < startWeekday; i++) cells += `<div></div>`;
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        let cls = "na";
        if (dateStr <= today) {
          if (subscriptionActiveOn(memberId, dateStr)) {
            cls = attSet.has(dateStr) ? "present" : "absent";
          }
        } else {
          cls = "na";
        }
        const isToday = dateStr === today ? " today" : "";
        const weekdayKey = dayKeys[(startWeekday + day - 1) % 7];
        const hasWorkout = (workout.days[weekdayKey] || []).length > 0 ? " has-workout" : "";
        cells += `<div class="cal-day ${cls}${isToday}${hasWorkout}" data-date="${dateStr}" data-weekday="${weekdayKey}" style="cursor:pointer" title="${dateStr}" onclick="selectCalendarDay('${dateStr}','${weekdayKey}')">${day}</div>`;
      }
      const monthLabel = first.toLocaleDateString(currentLang === "ar" ? "ar-EG" : "en-US", { month: "long", year: "numeric" });
      return `
    <div class="row between" style="margin-bottom:10px;">
      <button class="btn small ghost" onclick="shiftCalendarMonth(-1)">${currentLang === 'ar' ? '›' : '‹'} ${t('prev_month')}</button>
      <b>${monthLabel}</b>
      <button class="btn small ghost" onclick="shiftCalendarMonth(1)">${t('next_month')} ${currentLang === 'ar' ? '‹' : '›'}</button>
    </div>
    <div class="cal-grid">
      ${dayKeys.map(d => `<div class="cal-head">${t("days_short")[d]}</div>`).join("")}
      ${cells}
    </div>
    <div class="row" style="margin-top:12px;gap:14px;font-size:12px;color:var(--muted)">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--good-dim);margin-inline-end:5px;"></span>${t("present")}</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--danger-dim);margin-inline-end:5px;"></span>${t("absent")}</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#F0F0EC;margin-inline-end:5px;"></span>${t("na")}</span>
    </div>
    <div id="calDayWorkout" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;">
      <div style="color:var(--muted);font-size:12.5px;">${t("select_day_hint")}</div>
    </div>
  `;
    }
    window._calState = { memberId: null, year: null, month: null, containerId: null };
    function shiftCalendarMonth(delta) {
      const s = window._calState;
      let m = s.month + delta, y = s.year;
      if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
      s.month = m; s.year = y;
      document.getElementById(s.containerId).innerHTML = buildCalendarHTML(s.memberId, y, m);
    }
    window.shiftCalendarMonth = shiftCalendarMonth;

    function selectCalendarDay(dateStr, weekday) {
      const s = window._calState;
      document.querySelectorAll(`#${s.containerId} .cal-day`).forEach(el => el.classList.remove("selected"));
      const clickedEl = document.querySelector(`#${s.containerId} .cal-day[data-date="${dateStr}"]`);
      if (clickedEl) clickedEl.classList.add("selected");
      const workout = getWorkoutPlan(s.memberId);
      const exercises = workout.days[weekday] || [];
      const box = document.getElementById("calDayWorkout");
      if (!box) return;
      const dayLabel = t("days")[weekday];
      if (!exercises.length) {
        box.innerHTML = `<div style="font-weight:800;font-size:13px;margin-bottom:6px;">${t("workout_for_day")} ${dayLabel}</div><div style="color:var(--muted);font-size:12.5px;">${t("no_workout_this_day")}</div>`;

        c.innerHTML = tw_card(`<div class="empty"><b>${t("no_plan_yet")}</b>${t("no_plan_yet_sub")}</div>`);
        return;
      }
      c.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${WEEK_DAYS.map(d => {
        const items = plan.days[d] || [];
        if (!items.length) return "";
        return tw_card(`
      <div class="font-extrabold mb-3" style="color:var(--ink)">${t("days")[d]}</div>
      <div class="space-y-2">${items.map(mm => `
        <div class="flex items-center justify-between rounded-lg px-3 py-2" style="background:var(--paper)">
          <div class="text-sm"><span class="font-semibold">${t(mm.meal_type)}:</span> ${mm.item}</div>
          <div class="text-xs" style="color:var(--muted)">${mm.calories || 0} kcal</div>
        </div>`).join("")}</div>
    `);
      }).join("")}</div>`;
    }

    function renderMemberStore(c) {
      const products = state.products.filter(p => p.stock > 0);
      c.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 grid grid-cols-2 sm:grid-cols-3 gap-3" id="memberProdGrid">
        ${products.map(p => `
          <div class="rounded-xl border p-3 cursor-pointer transition hover:shadow-md hover:-translate-y-0.5" style="border-color:var(--line);background:var(--surface)" onclick="addToMemberCart('${p.id}')">
            <div class="font-bold text-sm mb-2">${productName(p)}</div>
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full" style="background:#EEEEEA;color:var(--muted)">${t('stock')}: ${p.stock}</span>
              <span class="font-extrabold text-sm">${fmtMoney(p.price)}</span>
            </div>
          </div>
        `).join("") || `<div class="empty col-span-3">${t('no_products')}</div>`}
      </div>
      <div>
        <div class="font-extrabold mb-3" style="color:var(--ink)">${t('cart')}</div>
        <div id="memberCartBox">${renderMemberCartHTML()}</div>
      </div>
    </div>
  `;
    }
    function renderMemberCartHTML() {
      if (!memberCart.length) return tw_card(`<div class="empty">${t('empty_cart')}</div>`);
      const total = memberCart.reduce((a, l) => a + l.qty * l.price, 0);
      return tw_card(`
    <div class="space-y-2 mb-3">
      ${memberCart.map((l, i) => `
        <div class="flex items-center justify-between">
          <div class="text-sm">${productName(getProduct(l.productId))}<div class="text-xs" style="color:var(--muted)">${fmtMoney(l.price)} × ${l.qty}</div></div>
          <div class="flex items-center gap-2">
            <button class="qtybtn" onclick="changeMemberQty(${i},-1)">−</button><span>${l.qty}</span><button class="qtybtn" onclick="changeMemberQty(${i},1)">+</button>
          </div>
        </div>`).join("")}
    </div>
    <div class="flex justify-between font-extrabold text-base border-t pt-3" style="border-color:var(--line)"><span>${t('total')}</span><span>${fmtMoney(total)}</span></div>
    <button class="w-full mt-3 text-white font-bold py-2.5 rounded-lg transition active:scale-[0.98]" style="background:var(--accent)" onclick="placeMemberOrder()">${t('place_order')}</button>
  `);
    }
    function addToMemberCart(productId) {
      const p = getProduct(productId);
      const existing = memberCart.find(l => l.productId === productId);
      if (existing) { if (existing.qty < p.stock) existing.qty++; }
      else memberCart.push({ productId, qty: 1, price: p.price });
      document.getElementById("memberCartBox").innerHTML = renderMemberCartHTML();
    }
    function changeMemberQty(i, delta) {
      const line = memberCart[i]; const p = getProduct(line.productId);
      line.qty += delta;
      if (line.qty <= 0) memberCart.splice(i, 1); else if (line.qty > p.stock) line.qty = p.stock;
      document.getElementById("memberCartBox").innerHTML = renderMemberCartHTML();
    }
    function placeMemberOrder() {
      if (!memberCart.length) return;
      const m = currentMember();
      const total = memberCart.reduce((a, l) => a + l.qty * l.price, 0);
      state.orders.push({
        id: uid("ord"), member_id: m.id, date: todayISO(), status: "pending", total,
        items: memberCart.map(l => ({ product_id: l.productId, qty: l.qty, unit_price: l.price })),
      });
      memberCart = [];
      persist(); showToast(t("order_placed")); renderMemberStore(document.getElementById("memberContent"));
    }
    window.addToMemberCart = addToMemberCart;
    window.changeMemberQty = changeMemberQty;
    window.placeMemberOrder = placeMemberOrder;

    function renderMemberOrders(c) {
      const m = currentMember();
      const orders = state.orders.filter(o => o.member_id === m.id).sort((a, b) => new Date(b.date) - new Date(a.date));
      c.innerHTML = `
    <div class="table-wrap">
      ${orders.length ? `<table><thead><tr><th>${t('order_number')}</th><th>${t('date')}</th><th>${t('total')}</th><th>${t('order_status')}</th></tr></thead>
      <tbody>${orders.map(o => `<tr>
        <td><span class="pill">${o.id.slice(-6)}</span></td>
        <td>${fmtDate(o.date)}</td>
        <td>${fmtMoney(o.total)}</td>
        <td><span class="badge ${o.status === 'fulfilled' ? 'good' : 'warn'}">${o.status === 'fulfilled' ? t('fulfilled') : t('pending')}</span></td>
      </tr>`).join("")}</tbody></table>` : `<div class="empty">${t('no_orders')}</div>`}
    </div>
  `;
    }

    function renderMemberProfile(c) {
      const m = currentMember();
      c.innerHTML = tw_card(`
    <div class="text-center">
      <div class="w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center text-white font-extrabold text-xl" style="background:var(--accent)">${initials(m.name)}</div>
      <div class="font-extrabold text-lg">${m.name}</div>
      <div class="text-sm mb-4" style="color:var(--muted)">${m.phone || ''}</div>
      <svg id="profileBarcodeSvg" class="mx-auto"></svg>
      <div class="font-mono tracking-widest text-sm mt-1">${m.code}</div>
    </div>
  `, "max-w-sm mx-auto");
      setTimeout(() => { try { JsBarcode("#profileBarcodeSvg", m.code, { format: "CODE128", width: 2, height: 54, displayValue: false, margin: 6 }); } catch (e) { } }, 30);
    }

    /* =========================================================================
       BOOTSTRAP
    ========================================================================= */
    (async function init() {
      document.getElementById("app").innerHTML = '<div style="padding:40px;color:#888;">Loading…</div>';
      await loadState();
      await loadSession();
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
      if (session) {
        const stillValid = session.role === "staff"
          ? state.users.some(u => u.id === session.userId)
          : state.users.some(u => u.id === session.userId) && getMember(session.memberId);
        if (stillValid) routeToApp(); else { session = null; renderLogin(); }
      } else {
        renderLogin();
      }
    })();
  </script>
</body>

</html>
